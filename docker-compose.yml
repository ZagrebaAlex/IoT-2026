services:
  mongo:
    image: mongo:7
    container_name: wsn-mongo
    security_opt:
      - seccomp:unconfined
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wsn-backend
    security_opt:
      - seccomp:unconfined
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: iot_project
      MONGO_COLLECTION: measurements
    ports:
      - "8000:8000"

  ingestion:
    build:
      context: .
      dockerfile: Ingestion/Dockerfile
    container_name: wsn-ingestion
    security_opt:
      - seccomp:unconfined
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: iot_project
      MONGO_COLLECTION: measurements
      DATA_SOURCE: stdin
    stdin_open: true
    profiles:
      - stdin

volumes:
  mongo_data:
